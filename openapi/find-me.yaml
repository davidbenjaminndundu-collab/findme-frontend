    WebhookPaiementPayload:
      type: object
      description: Payload reçu de l'opérateur/agrégateur Mobile Money. La forme exacte dépend du fournisseur choisi. Le backend
        doit conserver le payload brut, vérifier la signature et extraire l'identifiant événement, la référence opérateur,
        le montant et le statut via un adaptateur fournisseur.
      additionalProperties: true
    SimpleMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
  responses:
    UnauthorizedError:
      description: Session absente, expirée ou non authentifiée
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - message
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            error: unauthenticated
            message: Authentification requise.
    ForbiddenError:
      description: Utilisateur authentifié mais non autorisé pour cette opération
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - message
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            error: forbidden
            message: Accès interdit pour ce rôle ou cette ressource.
    ValidationError:
      description: Données reçues invalides
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - message
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            error: validation_error
            message: Les données fournies sont invalides.
            details:
              telephone:
              - Le format du téléphone est invalide.
    ConflictError:
      description: Conflit métier ou transition d’état impossible
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - message
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  items:
                    type: string
    TooManyRequestsError:
      description: Trop de tentatives ou de requêtes
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - message
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  items:
                    type: string
    AccountUnavailableError:
      description: Compte non actif, suspendu, bloqué ou fermé
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - message
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  items:
                    type: string
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
      - Auth
      operationId: initialiserCsrfSanctum
      summary: Initialiser la protection CSRF de Sanctum
      description: À appeler avant la première requête d'authentification depuis la SPA. Le navigateur reçoit le cookie XSRF-TOKEN.
        Avec Axios, utiliser withCredentials=true et withXSRFToken=true.
      servers:
      - url: http://localhost:8000
        description: Laravel local
      - url: https://api.findme.cd
        description: Production
      responses:
        '204':
          description: Cookie CSRF initialisé
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Inscription d'un nouvel utilisateur
      description: 'Vérifie unicité téléphone/email, crée le compte en statut `a_verifier`, génère un OTP Redis et l''envoie
        par SMS. Le rôle administrateur est interdit.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Compte créé, OTP envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Compte créé. Vérifiez votre téléphone.
                  id_utilisateur:
                    type: integer
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      operationId: inscrireUtilisateur
  /auth/verify-phone:
    post:
      tags:
      - Auth
      summary: Vérifier l'OTP et activer le compte
      description: Valide l'OTP, active automatiquement le compte puis ouvre une session Laravel. Aucun JWT ni refresh token
        n'est retourné.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Compte activé et session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      operationId: verifierTelephone
  /auth/login:
    post:
      tags:
      - Auth
      summary: Authentification utilisateur
      description: Authentifie par téléphone + mot de passe et ouvre une session Laravel Sanctum. Le cookie de session est
        géré par le navigateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Connexion réussie et session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/AccountUnavailableError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      operationId: connecterUtilisateur
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Déconnexion
      security:
      - SanctumSession: []
      responses:
        '200':
          description: Session fermée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: deconnecterUtilisateur
      description: Invalide la session Laravel courante et régénère le jeton CSRF côté serveur si nécessaire.
  /auth/me:
    get:
      tags:
      - Auth
      summary: Profil de l'utilisateur connecté
      security:
      - SanctumSession: []
      responses:
        '200':
          description: Profil courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: lireUtilisateurCourant
    patch:
      tags:
      - Auth
      summary: Modifier son profil
      security:
      - SanctumSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurUpdate'
      responses:
        '200':
          description: Profil mis à jour
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: modifierUtilisateurCourant
  /auth/password/forgot:
    post:
      tags:
      - Auth
      summary: Demander un OTP de récupération de compte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgot'
      responses:
        '200':
          description: Si le numéro existe, un OTP est envoyé (réponse uniforme).
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      operationId: demanderReinitialisationMotDePasse
  /auth/password/reset:
    post:
      tags:
      - Auth
      summary: Définir un nouveau mot de passe via OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: Mot de passe mis à jour et sessions précédentes invalidées
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      operationId: reinitialiserMotDePasse
      description: Valide l'OTP, remplace le mot de passe puis invalide les sessions actives de l'utilisateur.
  /users:
    get:
      tags:
      - Utilisateurs
      summary: Liste des utilisateurs
      security:
      - SanctumSession: []
      parameters:
      - name: role
        in: query
        schema:
          type: string
          enum:
          - client
          - prestataire
          - administrateur
      - name: statut_compte
        in: query
        schema:
          type: string
          enum:
          - a_verifier
          - actif
          - suspendu
          - bloque
          - ferme
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Tableau d'utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateursPage'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: listerUtilisateurs
      x-roles:
      - administrateur
      x-mvp-priority: P1
  /users/{id}:
    get:
      tags:
      - Utilisateurs
      summary: Détails d'un utilisateur
      security:
      - SanctumSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Détails de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '404':
          description: Utilisateur introuvable
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: lireUtilisateur
      x-roles:
      - administrateur
      x-mvp-priority: P1
    patch:
      tags:
      - Utilisateurs
      summary: Modifier le statut d'un compte (suspendre / bloquer / réactiver)
      security:
      - SanctumSession: []
      description: 'Réservé à l''administrateur. Un admin ne peut pas modifier son propre statut.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutCompteUpdate'
      responses:
        '200':
          description: Statut mis à jour
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Utilisateur introuvable
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: modifierStatutUtilisateur
      x-roles:
      - administrateur
      x-mvp-priority: P1
  /categories:
    get:
      tags:
      - Catégories
      summary: Liste des catégories
      parameters:
      - name: est_active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Tableau de catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categorie'
      operationId: listerCategories
      x-mvp-priority: P0
    post:
      tags:
      - Catégories
      summary: Enregistrer une nouvelle catégorie
      security:
      - SanctumSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorieCreate'
      responses:
        '201':
          description: Catégorie créée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: creerCategorie
      x-roles:
      - administrateur
      x-mvp-priority: P1
  /categories/{id}:
    get:
      tags:
      - Catégories
      summary: Détails d'une catégorie
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Détails de la catégorie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categorie'
        '404':
          description: Catégorie introuvable
      operationId: lireCategorie
      x-mvp-priority: P0
    delete:
      tags:
      - Catégories
      summary: Désactiver une catégorie (Soft Delete)
      security:
      - SanctumSession: []
      description: 'Suppression logique : passe est_active à false. Conserve les annonces existantes.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Catégorie désactivée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: desactiverCategorie
      x-roles:
      - administrateur
      x-mvp-priority: P1
    patch:
      tags:
      - Catégories
      summary: Modifier une catégorie
      security:
      - SanctumSession: []
      description: 'Mise à jour nom, description, icône ou activation. Réservé administrateur.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorieUpdate'
      responses:
        '200':
          description: Catégorie mise à jour
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Catégorie introuvable
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: modifierCategorie
      x-roles:
      - administrateur
      x-mvp-priority: P1
  /annonces:
    get:
      tags:
      - Annonces
      summary: Liste / recherche des annonces
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: statut
        in: query
        schema:
          type: string
          enum:
          - brouillon
          - en_attente_validation
          - publiee
          - refusee
          - desactivee
          - supprimee
        description: Filtre réservé au back-office authentifié. Pour un visiteur, seules les annonces publiées sont retournées.
      - name: id_categorie
        in: query
        schema:
          type: integer
      - name: id_prestataire
        in: query
        schema:
          type: integer
      - name: prix_min
        in: query
        schema:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
      - name: prix_max
        in: query
        schema:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
      - name: delai_max
        in: query
        schema:
          type: integer
          minimum: 1
      - name: note_min
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Tableau d'annonces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnoncesPage'
      operationId: rechercherAnnonces
      x-mvp-priority: P0
    post:
      tags:
      - Annonces
      summary: Enregistrer une nouvelle annonce
      security:
      - SanctumSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnonceCreate'
      responses:
        '201':
          description: Annonce créée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: creerAnnonce
      x-roles:
      - prestataire
      x-mvp-priority: P0
  /annonces/{id}:
    get:
      tags:
      - Annonces
      summary: Détails d'une annonce spécifique
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Détails de l'annonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annonce'
        '404':
          description: Annonce introuvable
      operationId: lireAnnonce
      x-mvp-priority: P0
    delete:
      tags:
      - Annonces
      summary: Retirer/Supprimer une annonce (Soft Delete)
      security:
      - SanctumSession: []
      description: 'Suppression logique : passe le statut à ''supprimee'' au lieu de DELETE physique. Préserve l''historique
        des commandes et garantit la traçabilité.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Annonce marquée comme supprimee
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: supprimerAnnonce
      x-roles:
      - prestataire
      x-mvp-priority: P1
    patch:
      tags:
      - Annonces
      summary: Modifier une annonce
      security:
      - SanctumSession: []
      description: 'Prestataire propriétaire. Autorisé si statut brouillon ou refusee. Admin : voir PATCH /annonces/{id}/moderation.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnonceUpdate'
      responses:
        '200':
          description: Annonce mise à jour
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Annonce introuvable
        '409':
          description: Statut non modifiable
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: modifierAnnonce
      x-roles:
      - prestataire
      x-mvp-priority: P0
  /annonces/{id}/soumettre:
    post:
      tags:
      - Annonces
      summary: Soumettre une annonce à validation
      security:
      - SanctumSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Annonce en attente de validation
        '409':
          description: Transition impossible
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: soumettreAnnonce
      x-roles:
      - prestataire
      x-mvp-priority: P0
  /annonces/{id}/moderation:
    patch:
      tags:
      - Annonces
      summary: Publier ou refuser une annonce (Admin uniquement)
      security:
      - SanctumSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAnnonce'
      responses:
        '200':
          description: Décision appliquée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: modererAnnonce
