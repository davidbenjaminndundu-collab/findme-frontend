openapi: 3.0.3
info:
  title: Find Me - API Contractuelle
  version: 1.1.0-sanctum
  description: Contrat officiel d'interface entre le Backend Laravel et le Frontend React/PWA de Find Me. Cette version utilise
    Laravel Sanctum en mode SPA avec session Laravel et cookies sécurisés. Le frontend ne stocke aucun access token ni refresh
    token. Les requêtes d'écriture utilisent la protection CSRF de Laravel/Sanctum. Toute divergence entre le code livré et
    ce contrat doit être traitée comme une anomalie contractuelle.
  contact:
    name: Équipe Développement Find Me
servers:
- url: http://localhost:8000/api/v1
  description: Serveur de développement (Laravel local)
- url: https://api.findme.cd/api/v1
  description: Serveur de production (HTTPS obligatoire)
tags:
- name: Auth
  description: Authentification SPA Laravel Sanctum, session, cookie HttpOnly et protection CSRF
- name: Utilisateurs
  description: Comptes, rôles et statuts (RBAC)
- name: Catégories
  description: Classification des services
- name: Annonces
  description: Catalogue de services et cycle de vie des offres
- name: Prestataires
  description: Profils professionnels publics et édition
- name: Commandes
  description: Demandes, actions de cycle, livraisons et révisions
- name: Paiements
  description: Initiation client et callback Mobile Money
- name: Wallet & Retraits
  description: Portefeuille prestataire et sorties Mobile Money
- name: Litiges & Avis
  description: Réclamations et notation post-commande
- name: Notifications
  description: Supervision in-app et acquittement
- name: Export
  description: Extraction CSV pour analyse externe ou rapports
components:
  securitySchemes:
    SanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Session Laravel utilisée par Sanctum en mode SPA. Le cookie est géré par le navigateur et doit être configuré
        HttpOnly et Secure en production. Le frontend ne lit pas sa valeur.
  schemas:
    UserLogin:
      type: object
      required:
      - telephone
      - mot_de_passe
      properties:
        telephone:
          type: string
          description: Numéro de téléphone unique
          example: '+243810000001'
          pattern: ^\+243[0-9]{9}$
        mot_de_passe:
          type: string
          format: password
          example: SecurePass123!
          minLength: 8
    UserRegister:
      type: object
      required:
      - telephone
      - mot_de_passe
      - nom
      - prenom
      - role
      properties:
        telephone:
          type: string
          example: '+243810000001'
          pattern: ^\+243[0-9]{9}$
        mot_de_passe:
          type: string
          format: password
          example: SecurePass123!
          minLength: 8
        nom:
          type: string
          example: Kalilwa
          minLength: 1
          maxLength: 100
        prenom:
          type: string
          example: Jean-François
          minLength: 1
          maxLength: 100
        postnom:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
          example: jean@findme.cd
        role:
          type: string
          enum:
          - client
          - prestataire
    OtpVerify:
      type: object
      required:
      - telephone
      - code_otp
      properties:
        telephone:
          type: string
          pattern: ^\+243[0-9]{9}$
        code_otp:
          type: string
          example: '482193'
          pattern: ^[0-9]{6}$
          minLength: 6
          maxLength: 6
    PasswordForgot:
      type: object
      required:
      - telephone
      properties:
        telephone:
          type: string
          pattern: ^\+243[0-9]{9}$
    PasswordReset:
      type: object
      required:
      - telephone
      - code_otp
      - nouveau_mot_de_passe
      properties:
        telephone:
          type: string
          pattern: ^\+243[0-9]{9}$
        code_otp:
          type: string
          pattern: ^[0-9]{6}$
          minLength: 6
          maxLength: 6
        nouveau_mot_de_passe:
          type: string
          format: password
          minLength: 8
    StatutCompteUpdate:
      type: object
      required:
      - statut_compte
      properties:
        statut_compte:
          type: string
          enum:
          - actif
          - suspendu
          - bloque
          - ferme
        motif:
          type: string
          nullable: true
    Utilisateur:
      type: object
      properties:
        id_utilisateur:
          type: integer
          readOnly: true
        telephone:
          type: string
          pattern: ^\+243[0-9]{9}$
        nom:
          type: string
        prenom:
          type: string
        postnom:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - client
          - prestataire
          - administrateur
          readOnly: true
        image_profil:
          type: string
          nullable: true
        statut_compte:
          type: string
          enum:
          - a_verifier
          - actif
          - suspendu
          - bloque
          - ferme
          readOnly: true
      required:
      - id_utilisateur
      - telephone
      - nom
      - prenom
      - role
      - statut_compte
    Categorie:
      type: object
      properties:
        id_categorie:
          type: integer
        nom:
          type: string
        description:
          type: string
          nullable: true
        icone:
          type: string
          nullable: true
        est_active:
          type: boolean
    Annonce:
      type: object
      properties:
        id_annonce:
          type: integer
          readOnly: true
        id_categorie:
          type: integer
        id_prestataire:
          type: integer
          readOnly: true
        titre:
          type: string
        description:
          type: string
        prix_base:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          example: '20.00'
        delai_livraison_jours:
          type: integer
        nombre_revisions:
          type: integer
        livrables_inclus:
          type: string
        elements_requis_client:
          type: string
        image_couverture:
          type: string
          nullable: true
        mots_cles:
          type: string
          nullable: true
        conditions_particulieres:
          type: string
          nullable: true
        statut:
          type: string
          enum:
          - brouillon
          - en_attente_validation
          - publiee
          - refusee
          - desactivee
          - supprimee
          readOnly: true
        motif_refus:
          type: string
          nullable: true
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
      required:
      - id_annonce
      - id_categorie
      - id_prestataire
      - titre
      - description
      - prix_base
      - delai_livraison_jours
      - nombre_revisions
      - livrables_inclus
      - elements_requis_client
      - statut
    ModerationAnnonce:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - publier
          - refuser
        motif_refus:
          type: string
          nullable: true
    ProfilPrestataire:
      type: object
      properties:
        id_prestataire:
          type: integer
          readOnly: true
        id_utilisateur:
          type: integer
          readOnly: true
        nom_professionnel:
          type: string
        bio:
          type: string
        competences:
          type: string
        portfolio_url:
          type: string
          nullable: true
        note_moyenne:
          type: number
          readOnly: true
        nombre_avis:
          type: integer
          readOnly: true
        statut_disponibilite:
          type: string
          enum:
          - disponible
          - occupe
          - indisponible
    Commande:
      type: object
      properties:
        id_commande:
          type: integer
          readOnly: true
        id_prestataire:
          type: integer
          readOnly: true
        id_client:
          type: integer
          readOnly: true
        id_annonce:
          type: integer
        reference_commande:
          type: string
          readOnly: true
        description_commande:
          type: string
        titre_service:
          type: string
          readOnly: true
        montant_total:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        taux_commission:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          example: '10.00'
          readOnly: true
        montant_commission:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        montant_prestataire:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        delai_livraison_jours:
          type: integer
          readOnly: true
        nombre_revisions_incluses:
          type: integer
          readOnly: true
        nombre_revisions_utilisees:
          type: integer
          readOnly: true
        livrables_convenus:
          type: string
          readOnly: true
        statut:
          type: string
          enum:
          - en_attente_reponse
          - informations_demandees
          - refusee
          - en_attente_paiement
          - paiement_en_cours
          - payee
          - en_cours_realisation
          - livree
          - revision_demandee
          - en_revision
          - en_litige
          - terminee
          - annulee
          - remboursee
          readOnly: true
      required:
      - id_commande
      - id_prestataire
      - id_client
      - id_annonce
      - reference_commande
      - description_commande
      - titre_service
      - montant_total
      - taux_commission
      - montant_commission
      - montant_prestataire
      - delai_livraison_jours
      - nombre_revisions_incluses
      - nombre_revisions_utilisees
      - livrables_convenus
      - statut
    CommandeCreate:
      type: object
      required:
      - id_annonce
      - description_commande
      properties:
        id_annonce:
          type: integer
          minimum: 1
        description_commande:
          type: string
          minLength: 1
    CommandeAction:
      type: object
      required:
      - type_action
      properties:
        type_action:
          type: string
          enum:
          - accepter
          - refuser
          - demander_precisions
          - demarrer_realisation
          - valider_livraison
          - annuler
        motif:
          type: string
          nullable: true
          description: Obligatoire pour refuser, demander des précisions ou annuler selon la règle métier.
    Livraison:
      type: object
      properties:
        id_livraison:
          type: integer
          readOnly: true
        id_commande:
          type: integer
          readOnly: true
        numero_version:
          type: integer
          readOnly: true
        message:
          type: string
        url_fichier:
          type: string
        nom_fichier:
          type: string
        type_mime:
          type: string
        taille_octets:
          type: integer
        statut:
          type: string
          enum:
          - soumise
          - acceptee
          - a_reviser
          - remplacee
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          readOnly: true
    Revision:
      type: object
      properties:
        id_revision:
          type: integer
          readOnly: true
        id_commande:
          type: integer
          readOnly: true
        description:
          type: string
        statut:
          type: string
          enum:
          - demandee
          - acceptee
          - en_cours
          - livree
          - refusee
          - annulee
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    Paiement:
      type: object
      properties:
        id_paiement:
          type: integer
          readOnly: true
        id_commande:
          type: integer
          readOnly: true
        reference_interne:
          type: string
          readOnly: true
        montant:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        devise:
          type: string
          default: USD
          readOnly: true
        operateur:
          type: string
        numero_payeur_masque:
          type: string
          nullable: true
          readOnly: true
        statut:
          type: string
          enum:
          - cree
          - en_attente
          - confirme
          - echoue
          - expire
          - rembourse
          readOnly: true
    PaiementCreate:
      type: object
      required:
      - operateur
      - numero_payeur
      properties:
        operateur:
          type: string
          example: mpesa
          enum:
          - mpesa
          - airtel_money
          - orange_money
        numero_payeur:
          type: string
          pattern: ^\+243[0-9]{9}$
    Wallet:
      type: object
      properties:
        id_wallet:
          type: integer
        id_prestataire:
          type: integer
        devise:
          type: string
          default: USD
        solde_en_attente:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
        solde_disponible:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
    MouvementWallet:
      type: object
      properties:
        id_mouvement:
          type: integer
        type_mouvement:
          type: string
          enum:
          - credit_commande
          - debit_retrait
          - remboursement
          - ajustement_credit
          - ajustement_debit
        sens:
          type: string
          enum:
          - credit
          - debit
        montant:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
        solde_avant:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
        solde_apres:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
        reference:
          type: string
        statut:
          type: string
          enum:
          - en_attente
          - valide
          - annule
          - echoue
        created_at:
          type: string
          format: date-time
    Retrait:
      type: object
      properties:
        id_retrait:
          type: integer
          readOnly: true
        id_wallet:
          type: integer
          readOnly: true
        reference_retrait:
          type: string
          readOnly: true
        montant:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
        frais:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        montant_net:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        operateur:
          type: string
        numero_mobile_money:
          type: string
        statut:
          type: string
          enum:
          - demande
          - en_verification
          - approuve
          - en_cours_execution
          - execute
          - echoue
          - refuse
          readOnly: true
        motif_refus:
          type: string
          nullable: true
          readOnly: true
    DecisionRetrait:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approuver
          - refuser
        motif_refus:
          type: string
          nullable: true
    Avis:
      type: object
      properties:
        id_avis:
          type: integer
          readOnly: true
        id_commande:
          type: integer
          readOnly: true
        id_client:
          type: integer
          readOnly: true
        note:
          type: integer
          minimum: 1
          maximum: 5
        commentaire:
          type: string
          nullable: true
        statut:
          type: string
          enum:
          - publie
          - masque
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Litige:
      type: object
      properties:
        id_litige:
          type: integer
          readOnly: true
        id_commande:
          type: integer
          readOnly: true
        motif:
          type: string
        description:
          type: string
        preuves:
          type: object
          nullable: true
        statut:
          type: string
          enum:
          - ouvert
          - en_analyse
          - informations_demandees
          - resolu
          - ferme
          readOnly: true
        decision:
          type: string
          enum:
          - remboursement_total
          - paiement_total
          - repartition_partielle
          nullable: true
          readOnly: true
        montant_client:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
        montant_prestataire:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          readOnly: true
    DecisionLitige:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - remboursement_total
          - paiement_total
          - repartition_partielle
        montant_client:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
        montant_prestataire:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
    Notification:
      type: object
      properties:
        id_notification:
          type: integer
        type_notification:
          type: string
        titre:
          type: string
        message:
          type: string
        canal:
          type: string
          enum:
          - in_app
          - sms
          - email
        lien:
          type: string
          nullable: true
        lu_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationAck:
      type: object
      properties:
        statut:
          type: string
          enum:
          - lue
    ExportRequest:
      type: object
      properties:
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
        type_export:
          type: string
          enum:
          - commandes
          - paiements
          - avis
          - retraits
    SyncResponse:
      type: object
      properties:
        last_sync:
          type: string
          format: date-time
        new_notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        commandes_maj:
          type: array
          items:
            $ref: '#/components/schemas/Commande'
        paiements_maj:
          type: array
          items:
            $ref: '#/components/schemas/Paiement'
    UtilisateurUpdate:
      type: object
      additionalProperties: false
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 100
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        postnom:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
          maxLength: 255
        image_profil:
          type: string
          format: uri
          nullable: true
    AuthSessionResponse:
      type: object
      required:
      - message
      - utilisateur
      properties:
        message:
          type: string
          example: Connexion réussie.
        utilisateur:
          $ref: '#/components/schemas/Utilisateur'
    CategorieCreate:
      type: object
      additionalProperties: false
      required:
      - nom
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        icone:
          type: string
          nullable: true
        est_active:
          type: boolean
          default: true
    CategorieUpdate:
      type: object
      additionalProperties: false
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        icone:
          type: string
          nullable: true
        est_active:
          type: boolean
          default: true
    AnnonceCreate:
      type: object
      additionalProperties: false
      properties:
        id_categorie:
          type: integer
          minimum: 1
        titre:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        prix_base:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          example: '20.00'
        delai_livraison_jours:
          type: integer
          minimum: 1
        nombre_revisions:
          type: integer
          minimum: 0
          default: 0
        livrables_inclus:
          type: string
        elements_requis_client:
          type: string
        image_couverture:
          type: string
          format: uri
          nullable: true
        mots_cles:
          type: string
          nullable: true
          description: Liste textuelle simplifiée du MVP.
        conditions_particulieres:
          type: string
          nullable: true
    AnnonceUpdate:
      type: object
      additionalProperties: false
      properties:
        id_categorie:
          type: integer
          minimum: 1
        titre:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        prix_base:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          example: '20.00'
        delai_livraison_jours:
          type: integer
          minimum: 1
        nombre_revisions:
          type: integer
          minimum: 0
          default: 0
        livrables_inclus:
          type: string
        elements_requis_client:
          type: string
        image_couverture:
          type: string
          format: uri
          nullable: true
        mots_cles:
          type: string
          nullable: true
          description: Liste textuelle simplifiée du MVP.
        conditions_particulieres:
          type: string
          nullable: true
    ProfilPrestataireUpdate:
      type: object
      additionalProperties: false
      properties:
        nom_professionnel:
          type: string
          minLength: 1
          maxLength: 150
        bio:
          type: string
          minLength: 1
        competences:
          type: string
          minLength: 1
        portfolio_url:
          type: string
          format: uri
          nullable: true
        statut_disponibilite:
          type: string
          enum:
          - disponible
          - occupe
          - indisponible
    LivraisonCreate:
      type: object
      additionalProperties: false
      required:
      - message
      - url_fichier
      - nom_fichier
      - type_mime
      - taille_octets
      properties:
        message:
          type: string
          minLength: 1
        url_fichier:
          type: string
          format: uri
        nom_fichier:
          type: string
          minLength: 1
          maxLength: 255
        type_mime:
          type: string
          minLength: 1
          maxLength: 100
        taille_octets:
          type: integer
          minimum: 1
    RevisionCreate:
      type: object
      additionalProperties: false
      required:
      - description
      properties:
        description:
          type: string
          minLength: 1
    AvisCreate:
      type: object
      additionalProperties: false
      required:
      - note
      properties:
        note:
          type: integer
          minimum: 1
          maximum: 5
        commentaire:
          type: string
          nullable: true
    LitigeCreate:
      type: object
      additionalProperties: false
      required:
      - motif
      - description
      properties:
        motif:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        preuves:
          type: object
          nullable: true
          additionalProperties: true
    RetraitCreate:
      type: object
      additionalProperties: false
      required:
      - montant
      - operateur
      - numero_mobile_money
      properties:
        montant:
          type: string
          pattern: ^\d+(?:\.\d{1,2})?$
          example: '15.00'
        operateur:
          type: string
          minLength: 1
          maxLength: 30
        numero_mobile_money:
          type: string
          pattern: ^\+243[0-9]{9}$
    PaginationMeta:
      type: object
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
