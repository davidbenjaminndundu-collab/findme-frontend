services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: find_me_frontend

    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - find_me_frontend_node_modules:/app/node_modules

    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_ENABLE_MOCKS: ${VITE_ENABLE_MOCKS:-false}

    networks:
      - find_me_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:5173 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  find_me_frontend_node_modules:


networks:
  find_me_network:
    external: true